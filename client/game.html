<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
        <script src="/scripts/lobby/account.js"></script>
        <title>kingdomcrushers.io</title>
        <link rel="stylesheet" href="https://use.typekit.net/jbe5uxg.css" />
        <style>
            #connecting_screen { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #1f1f1f; color: white; }
            html {
                font-family: "myriad-pro";
                font-weight: 400;
                color: white;
            }

            .progressbar {
                position: relative;
                background-color: #636363;
                height: 0.25rem;
                color: white;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
            }

            .progress {
                height: 100%;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;

                position: absolute;
                bottom: 50%;
                left: -12px;

                transform: translate(0, 50%);
                transition: width 0.3s ease;
            }

            .progress_label {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                margin: 0;
            }

            .bottom_container {
                position: absolute;
                bottom: 1rem;
                left: 50%;
                transform: translate(-50%, 0);
            }

            .tooltip {
                background: none;
                border: none;
                padding: 0;
                font: inherit;
                color: white;
                opacity: 0.7;
                pointer-events: none;
            }

            .message_container {
                position: absolute;
                bottom: 1rem;
                left: 1rem;
                margin: 0;

                width: 20rem;
                max-width: min(20rem, calc(50vw - 198px - 4rem));
                height: 10rem;
                max-height: 10rem;
                overflow: hidden;

                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 1rem;

                pointer-events: none;
                mask-image: linear-gradient(to bottom, transparent 0%, black 50%);
            }

            .outlined_text {
                text-shadow:
                    -1px -1px 0 black,
                     1px -1px 0 black,
                    -1px  1px 0 black,
                     1px  1px 0 black;
            }
            .message_box {
                pointer-events: all;
                background-color: transparent;
                border: none;

                font: inherit;
                color: #fff;
            }
            .message_box::placeholder {
              color: #fff;
              opacity: 0.5;
              text-shadow: none;
            }

            .message {
                color: yellow;
                display: flex;
                align-items: flex-start;
                margin-bottom: 0.5rem;
            }
            .message label {
                margin-right: 0.5rem;
            }
            .message p {
                color: white;
                margin: 0;
            }
            .error p {
                color: palevioletred;
            }
            .error label {
                color: red;
            }
            .success p {
                color: palegreen;
            }
            .success label {
                color: mediumseagreen;
            }

            .chat_bubble {
                position: absolute;
                bottom: calc(50% + 32px);
                left: calc(50%);
                transform: translate(-50%, -50%);

                color: #636363;
                background-color: white;
                background-clip: padding-box;
                border-image: url("/assets/ui/chat_bubble.png") 9 / 12px / 0 round;
                border-width: 12px;
                border-style: solid;

                max-width: 200px;
                word-wrap: break-word;
                white-space: normal;
                text-align: center;

                filter: opacity(0.9);
            }
            .hidden {
                display: none !important;
            }
        </style>
        <link rel="stylesheet" href="styles/inventory.css">
        <link rel="stylesheet" href="styles/lobby.css">
        <link rel="stylesheet" href="styles/joystick/joystick.css">
        <link rel="stylesheet" href="styles/death.css">
    </head>
    <body style="margin: 0">
        <div id="connecting_screen" role="status"><span id="connecting_status">Connecting...</span></div>
        <script src="/scripts/loading/water.js"></script>
        <div class="top_right column">
            <span id="controls_tooltip" class="tooltip">[E] to open backpack</span>
        </div>
        <div class="bottom_container">
            <div id="healthbar" class="progressbar">
                <div id="health" style="background-color: #e14b4b;" class="progress" style="width: 90%"></div>
                <p id="health_label" class="progress_label">Lv.1</p>
            </div>
            <div id="hotbar" class="slots"></div>
        </div>
        <form onsubmit="submit_message(event)" class="message_container">
            <div class="messages" id="messages">
            </div>
            <input id="message_box" class="message_box outlined_text" placeholder="Enter to type a message..."></input>
        </form>

        <div id="inventory" class="inventory_container hidden">
            <div class="inventory_panel">
                <div class="inventory_top">
                    <canvas id="inventory_preview" class="inventory_preview" width="112" height="112"></canvas>
                    <div id="equipment_slots" class="equipment_slots"></div>
                </div>
                <div id="inventory_storage" class="inventory_storage"></div>
                <div class="seperator"></div>
                <div id="inventory_hotbar" class="inventory_hotbar"></div>
            </div>
        </div>

        <div id="menu" class="inventory_container hidden">
            <div class="center">
                <div class="panel">
                    <h3>Exit game</h3>
                    Do you want to exit?
                    <div class="group">
                        <button type="button" onclick="close_tab()">Cancel</button>
                        <button type="button" onclick="location.href='/'">Exit</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="top_left" style="filter: opacity(0.7);">
            <button id="home_button" class="blank_button hidden" onclick="open_tab(menuNode)" aria-label="Open exit menu">
                <span class="sprite" style="background-position: -40px -180px;"></span>
            </button>
            <button id="backpack_button" class="blank_button hidden" onclick="toggle_inventory()" aria-label="Open backpack">
                <span class="sprite" style="background-position: -20px -180px;"></span>
            </button>
        </div>

        <div id="death_screen" class="hidden">
            <div class="death_background"></div>
            <div class="panel death_content">
                <h3>You died!</h3>
                <canvas id="death_preview" style="margin-bottom: -20px;"></canvas>
                <label id="death_name" class="error"></label>
                <div class="seperator" style="margin-top: 6px; margin-bottom: 6px;"></div>
                <button id="death_continue" class="extrusion" style="width: 100%;" onclick="location.href='/'">Continue</button>
            </div>
        </div>

        <script src="/scripts/pkgs/pixi.js"></script>
        <script src="/scripts/pkgs/filters.js"></script>

        <script src="/scripts/data.js"></script>
        <script src="/scripts/engine/networking.js"></script>

        <script src="/scripts/graphics/app.js"></script>
        <script src="/scripts/graphics/load_textures.js"></script>
        <script src="/scripts/graphics/tiles.js"></script>
        <script src="/scripts/graphics/objects.js"></script>

        <script src="/scripts/engine/gameplay/bombs.js"></script>
        <script src="/scripts/engine/gameplay/particles.js"></script>
        <script src="/scripts/engine/gameplay/characters.js"></script>
        <script src="/scripts/engine/gameplay/npcs.js"></script>
        <script src="/scripts/engine/gameplay/loot.js"></script>
        <script src="/scripts/engine/gameplay/projectiles.js"></script>

        <script src="/scripts/engine/tabs/tabmanager.js"></script>

        <script src="/scripts/engine/inventory/inventory.js"></script>
        <script src="/scripts/engine/inventory/preview.js"></script>
        <script src="/scripts/graphics/character_preview.js"></script>

        <script src="/scripts/engine/chat.js"></script>
        <script src="/scripts/engine/engine.js"></script>
        <script src="/scripts/engine/player_character.js"></script>
        <script src="/styles/joystick/joystick.js"></script>
        <script src="/scripts/mobile/mobile.js"></script>
        <script src="/scripts/engine/death.js"></script>

        <script>
            init()
        </script>
    </body>
</html>
