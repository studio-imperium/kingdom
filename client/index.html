<html>
    <head>
        <title>Kingdom Crushers</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="/scripts/lobby/account.js"></script>
        <link rel="stylesheet" href="https://use.typekit.net/jbe5uxg.css" />
        <style>
            :root {
                --ping-good: #76dc8c;
                --ping-neutral: #ffb347;
                --ping-bad: #ff6b6b;
            }
            html {
                font-family: "myriad-pro";
                font-weight: 400;
                color: white;
                image-rendering: pixelated !important;
            }

            br {
                margin-top: 1px;
            }

            .topright_container {
                position: absolute;
                top: 1rem;
                right: 1rem;
                display: flex;
                max-width: calc(100% - 2rem);
            }
            .topleft_container {
                position: absolute;
                top: 1rem;
                left: 1rem;
                display: flex;
                max-width: calc(100% - 2rem);
            }

            .center_container {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                width: 20rem;
                max-width: calc(100% - 2rem);
            }

            #lobby_preview {
                display: block;
                width: 100%;
                height: auto;
                aspect-ratio: 1;
            }

            .green {
                background-color: greenyellow !important;
            }

            .button {
                font-family: "myriad-pro";
                font-weight: 400;
                font-size: 1rem;
                color: white;

                min-width: 8rem;

                background-color: #636363;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                padding: 2px;
                border-width: 12px;
                border-style: solid;
                box-sizing: border-box;
                image-rendering: pixelated;
            }
            .button:hover {
                color: #eee;
                background-color: #535353;
            }

            .text_input {
                font-family: "myriad-pro";
                font-weight: 400;
                font-size: 1rem;
                color: black;
                position: relative;
                background-color: white;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/text_input_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
                outline: none !important;
            }

            .dropdown {
                font-family: "myriad-pro";
                font-weight: 400;
                color: var(--ping-color, white);
                position: relative;
                background-color: #777;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
                outline: none !important;
            }

            .dropdown option { color: var(--ping-color, white); }

            .lobby_actions { display: flex; gap: 0; }
            .lobby_actions > * { flex: 0 0 50%; min-width: 0; box-sizing: border-box; }

            .slots {
                background-color: #636363;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                border-width: 12px;
                border-style: solid;

                border-collapse: separate;
                border-spacing: 4px 0;
            }
            .slot {
                margin: 2px;
                padding: 20px;
                width: 10px;
                height: 10px;

                background-color: #525252;
                border-image: url("/assets/ui/slot_border.png") 4 / 4px / 0 round;
                border-width: 4px;
                border-style: solid;

                image-rendering: pixelated;
                position: relative;
            }
            .slot:hover {
                filter: brightness(1.05);
            }
            .selected {
                background-color: #848484 !important;
                border: 4px solid white !important;
            }
            .slot_sprite {
                pointer-events: none;
                background-color: transparent;

                background-image: url("/assets/assets.png");
                background-position: 999px -10px;
                background-repeat: no-repeat;
                background-size: 512px 512px;
                padding: 0;
                width: 10px;
                height: 10px;
                scale: 4;
                image-rendering: pixelated;
                border: 0;
                filter: drop-shadow(0.5px 0 0 #2A2A2A)
                    drop-shadow(-0.5px 0 0 #2A2A2A) drop-shadow(0 0.5px 0 #2A2A2A)
                    drop-shadow(0 -0.5px 0 #2A2A2A);
            }

            .healthbar {
                position: relative;
                background-color: #636363;
                height: 0.25rem;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
            }

            .health {
                background-color: #e14b4b;
                height: 100%;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;

                position: absolute;
                bottom: 50%;
                left: -12px;

                transform: translate(0, 50%);
                transition: width 0.3s ease;
            }

            #health_label {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                margin: 0;
            }

            .bottom_container {
                position: absolute;
                bottom: 1rem;
                left: 50%;
                transform: translate(-50%, 0);
            }

            .message_container {
                position: absolute;
                bottom: 1rem;
                left: 1rem;
                margin: 0;

                width: 20rem;
                max-width: 20rem;
                height: 10rem;
                max-height: 10rem;
                overflow: hidden;

                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 1rem;

                pointer-events: none;
                mask-image: linear-gradient(to bottom, transparent 0%, black 50%);
            }

            .outlined_text {
                text-shadow:
                    -1px -1px 0 black,
                     1px -1px 0 black,
                    -1px  1px 0 black,
                     1px  1px 0 black;
            }
            .message_box {
                pointer-events: all;
                background-color: transparent;
                border: none;

                font: inherit;
                color: #fff;
            }
            .message_box::placeholder {
              color: #fff;
              opacity: 0.5;
              text-shadow: none;
            }

            .message {
                color: yellow;
                display: flex;
                align-items: flex-start;
                margin-bottom: 0.5rem;
            }
            .message label {
                margin-right: 0.5rem;
            }
            .message p {
                color: white;
                margin: 0;
            }
            .error p {
                color: palevioletred;
            }
            .error label {
                color: red;
            }
            .success p {
                color: palegreen;
            }
            .success label {
                color: mediumseagreen;
            }

            .chat_bubble {
                position: absolute;
                bottom: calc(50% + 32px);
                left: calc(50%);
                transform: translate(-50%, -50%);

                color: #636363;
                background-color: white;
                background-clip: padding-box;
                border-image: url("/assets/ui/chat_bubble.png") 9 / 12px / 0 round;
                border-width: 12px;
                border-style: solid;

                max-width: 200px;
                word-wrap: break-word;
                white-space: normal;
                text-align: center;

                filter: opacity(0.9);
            }
            .modal {
                font: inherit;
                color: white;
                background: #636363;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                border-width: 12px;
                border-style: solid;
                box-sizing: border-box;
                width: 24rem;
                max-width: calc(100% - 2rem);
                max-height: calc(100% - 2rem);
                padding: 1rem;
            }
            .modal::backdrop { background: #0009; }
            .modal h2 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 400; }
            .modal_content { display: flex; flex-direction: column; gap: 0.5rem; }
            .modal p { margin: 0 0 0.5rem; overflow-wrap: anywhere; }
            .modal .text_input { min-width: 0; }
            .modal .button { width: 100%; }
            .modal_close { margin-top: 1rem; }
            .modal :focus-visible { outline: 2px solid white !important; outline-offset: 2px; }
            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body style="margin: 0">
        <div class="topleft_container">

        </div>

        <div class="topright_container">
            <button class="button" commandfor="login_modal" command="show-modal">Login</button>
        </div>

        <div class="center_container">
            <canvas id="lobby_preview" width="256" height="256" aria-label="Character preview"></canvas>
            <input class="text_input">
            <div style="margin-bottom: 4px" class="lobby_actions">
                <select class="dropdown" name="servers" id="servers">
                  <option value="">Loading servers…</option>
                </select>
                <button class="button">Play</button>
            </div>
            <button style="margin-bottom: 4px" class="button" commandfor="leaderboard_modal" command="show-modal">Leaderboard</button>
            <button class="button" commandfor="graveyard_modal" command="show-modal">Graveyard</button>
        </div>

        <dialog class="modal" id="login_modal" aria-labelledby="login_title">
            <h2 id="login_title">Login</h2>
            <div class="modal_content">
                <label for="login_email">Email</label>
                <input class="text_input" id="login_email" name="email" type="email" autocomplete="username" required>
                <label for="login_password">Password</label>
                <input class="text_input" id="login_password" name="password" type="password" autocomplete="current-password" required>
                <button class="button" type="button">Login</button>
            </div>
            <button class="button modal_close" commandfor="login_modal" command="close">Close</button>
        </dialog>

        <dialog class="modal" id="leaderboard_modal" aria-labelledby="leaderboard_title">
            <h2 id="leaderboard_title">Leaderboard</h2>
            <p>Rankings are not available yet.</p>
            <button class="button modal_close" commandfor="leaderboard_modal" command="close" autofocus>Close</button>
        </dialog>

        <dialog class="modal" id="graveyard_modal" aria-labelledby="graveyard_title">
            <h2 id="graveyard_title">Graveyard</h2>
            <p>No fallen characters to display.</p>
            <button class="button modal_close" commandfor="graveyard_modal" command="close" autofocus>Close</button>
        </dialog>

        <script src="/scripts/pkgs/pixi.js"></script>
        <script src="/scripts/pkgs/filters.js"></script>

        <script src="/scripts/data.js"></script>
        <script src="/scripts/engine/networking.js"></script>

        <script src="/scripts/graphics/app.js"></script>
        <script src="/scripts/graphics/load_textures.js"></script>
        <script src="/scripts/graphics/tiles.js"></script>
        <script src="/scripts/graphics/objects.js"></script>

        <script src="/scripts/engine/gameplay/characters.js"></script>

        <script src="/scripts/engine/engine.js"></script>

        <script src="/scripts/lobby/engine.js"></script>
        <script src="/scripts/lobby/servers.js"></script>
        <script src="/scripts/lobby/default_name.js"></script>
        <script src="/scripts/lobby/play.js"></script>
        <script>
            account_ready.then(() => {
                init_lobby();
                load_servers();
            });
        </script>
    </body>
</html>
