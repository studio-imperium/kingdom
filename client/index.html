<html>
    <head>
        <meta charset="utf-8">
        <title>Kingdom Crushers</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="/scripts/lobby/account.js"></script>
        <link rel="stylesheet" href="https://use.typekit.net/jbe5uxg.css" />
        <style>
            :root {
                --ping-good: #76dc8c;
                --ping-neutral: #ffb347;
                --ping-bad: #ff6b6b;
            }
            html {
                font-family: "myriad-pro";
                font-weight: 400;
                color: rgb(211, 211, 211);
                image-rendering: pixelated !important;
            }

            #character_preview { align-self: center; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; margin-bottom: -1rem; }

            br {
                margin-top: 1px;
            }

            .panel {
                margin-bottom: 6px;
                font-family: "myriad-pro";
                font-weight: 400;
                font-size: 1rem;
                color: rgb(211, 211, 211);

                min-width: 8rem;

                background-color: #636363;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                padding: 6px;
                border-width: 12px;
                border-style: solid;
                box-sizing: border-box;
                image-rendering: pixelated;

                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .panel input {
                font-family: "myriad-pro";
                font-weight: 400;
                font-size: 1rem;
                color: rgb(211, 211, 211);
                position: relative;

                display: flex;
                box-sizing: content-box;
                justify-content: center;

                background-color: #525252;
                border-image: url("/assets/ui/slot_border.png") 4 / 4px / 0 round;
                border-width: 4px;
                border-style: solid;
                outline: none;

                width: 95%;
                padding: 4px;
            }

            .topright_container {
                position: absolute;
                top: 1rem;
                right: 1rem;
                display: flex;
                max-width: calc(100% - 2rem);
            }
            .topleft_container {
                position: absolute;
                top: 1rem;
                left: 1rem;
                display: flex;
                max-width: calc(100% - 2rem);
            }

            .center_container {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                width: 20rem;
                max-width: calc(100% - 2rem);
            }

            .enemy_preview_slot { width: 100%; margin-bottom: -2rem; }

            #leaderboard_screen .center_container { max-height: calc(100dvh - 2rem); }
            #leaderboard_screen .panel { align-items: stretch; max-height: calc(100dvh - 2rem); }
            #leaderboard_screen h3 { margin: 0 0 4px; }
            #leaderboard_screen p { margin: 0 0 12px; }
            .leaderboard_scroll { overflow-y: auto; min-height: 0; margin-bottom: 12px; }
            #leaderboard_screen table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; }
            #leaderboard_screen th { position: sticky; top: 0; background: #525252; z-index: 1; }
            #leaderboard_screen th, #leaderboard_screen td { padding: 4px 8px; }
            #leaderboard_screen td { border-bottom: 1px solid #777; overflow-wrap: anywhere; }
            #leaderboard_screen th:first-child { width: 2.5rem; }
            #leaderboard_screen th:nth-child(3) { width: 64px; }
            #leaderboard_screen th:last-child { width: 3rem; text-align: right; }
            #leaderboard_screen td:last-child { text-align: right; }
            #leaderboard_screen canvas { display: block; width: 64px; height: 64px; }
            #leaderboard_screen small { display: block; opacity: 0.7; }

            #lobby_preview, #enemy_preview {
                display: block;
                width: 100%;
                height: auto;
                aspect-ratio: 1;
            }

            .green {
                background-color: greenyellow !important;
            }

            .button_text {
                font-family: "myriad-pro";
                font-weight: 400;
                color: rgba(255,255,255,0.6);
                position: relative;
                background-color: transparent;
                border: none;
                outline: none;

                font-size: 1.25rem;
            }

            .button_alt {
                font-family: "myriad-pro";
                font-weight: 400;
                color: var(--ping-color, white);
                position: relative;
                background-color: #777;

                min-width: 8rem;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
                outline: none !important;
            }

            .topleft_container .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
            .topleft_container .slot_sprite { flex-shrink: 0; margin: 0 15px; }

            .button_square {
                width: 64px;
                height: 64px;
                min-width: 64px !important;
                margin: 3px;
            }
            .button {
                font-family: "myriad-pro";
                font-weight: 400;
                font-size: 1rem;
                color: rgb(211, 211, 211);

                min-width: 8rem;

                background-color: #636363;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                padding: 6px;
                border-width: 12px;
                border-style: solid;
                box-sizing: border-box;
                image-rendering: pixelated;
            }
            .button:hover {
                color: #eee;
                background-color: #535353;
            }

            .text_input {
                font-family: "myriad-pro";
                font-weight: 400;
                font-size: 1rem;
                color: black !important;
                position: relative;
                background-color: white !important;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/text_input_border.png") 9 / 9px / 0
                    round !important;
                border-width: 12px;
                border-style: solid;
                outline: none !important;
            }

            .dropdown {
                font-family: "myriad-pro";
                font-weight: 400;
                color: var(--ping-color, white);
                position: relative;
                background-color: #777;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
                outline: none !important;
            }

            .dropdown option { color: var(--ping-color, white); }

            .lobby_actions { display: flex; gap: 0; width: 100%; }
            .lobby_actions > * { flex: 0 0 50%; min-width: 0; box-sizing: border-box; }

            .slots {
                background-color: #636363;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                border-width: 12px;
                border-style: solid;

                border-collapse: separate;
                border-spacing: 4px 0;
            }
            .slot {
                margin: 2px;
                padding: 20px;
                width: 10px;
                height: 10px;

                background-color: #525252;
                border-image: url("/assets/ui/slot_border.png") 4 / 4px / 0 round;
                border-width: 4px;
                border-style: solid;

                image-rendering: pixelated;
                position: relative;
            }
            .slot:hover {
                filter: brightness(1.05);
            }
            .selected {
                background-color: #848484 !important;
                border: 4px solid white !important;
            }
            .slot_sprite {
                pointer-events: none;
                background-color: transparent;

                background-image: url("/assets/assets.png");
                background-position: 999px -10px;
                background-repeat: no-repeat;
                background-size: 512px 512px;
                padding: 0;
                width: 10px;
                height: 10px;
                scale: 4;
                image-rendering: pixelated;
                border: 0;
                filter: drop-shadow(0.5px 0 0 #2A2A2A)
                    drop-shadow(-0.5px 0 0 #2A2A2A) drop-shadow(0 0.5px 0 #2A2A2A)
                    drop-shadow(0 -0.5px 0 #2A2A2A);
            }

            .healthbar {
                position: relative;
                background-color: #636363;
                height: 0.25rem;

                display: flex;
                box-sizing: content-box;
                justify-content: center;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;
            }

            .health {
                background-color: #e14b4b;
                height: 100%;
                border-image: url("/assets/ui/health_border.png") 9 / 9px / 0
                    round;
                border-width: 12px;
                border-style: solid;

                position: absolute;
                bottom: 50%;
                left: -12px;

                transform: translate(0, 50%);
                transition: width 0.3s ease;
            }

            #health_label {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                margin: 0;
            }

            .bottom_container {
                position: absolute;
                bottom: 1rem;
                left: 50%;
                transform: translate(-50%, 0);
            }

            .message_container {
                position: absolute;
                bottom: 1rem;
                left: 1rem;
                margin: 0;

                width: 20rem;
                max-width: 20rem;
                height: 10rem;
                max-height: 10rem;
                overflow: hidden;

                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 1rem;

                pointer-events: none;
                mask-image: linear-gradient(to bottom, transparent 0%, black 50%);
            }

            .outlined_text {
                text-shadow:
                    -1px -1px 0 black,
                     1px -1px 0 black,
                    -1px  1px 0 black,
                     1px  1px 0 black;
            }
            .message_box {
                pointer-events: all;
                background-color: transparent;
                border: none;

                font: inherit;
                color: #fff;
            }
            .message_box::placeholder {
              color: #fff;
              opacity: 0.5;
              text-shadow: none;
            }

            .message {
                color: yellow;
                display: flex;
                align-items: flex-start;
                margin-bottom: 0.5rem;
            }
            .message label {
                margin-right: 0.5rem;
            }
            .message p {
                color: white;
                margin: 0;
            }
            .error p {
                color: palevioletred;
            }
            .error label {
                color: red;
            }
            .success p {
                color: palegreen;
            }
            .success label {
                color: mediumseagreen;
            }

            .chat_bubble {
                position: absolute;
                bottom: calc(50% + 32px);
                left: calc(50%);
                transform: translate(-50%, -50%);

                color: #636363;
                background-color: white;
                background-clip: padding-box;
                border-image: url("/assets/ui/chat_bubble.png") 9 / 12px / 0 round;
                border-width: 12px;
                border-style: solid;

                max-width: 200px;
                word-wrap: break-word;
                white-space: normal;
                text-align: center;

                filter: opacity(0.9);
            }
            .modal {
                display: none;
                font: inherit;
                color: white;
                background: #636363;
                border-image: url("/assets/ui/border.png") 9 / 9px / 0 round;
                border-width: 12px;
                border-style: solid;
                box-sizing: border-box;
                width: 24rem;
                max-width: calc(100% - 2rem);
                max-height: calc(100% - 2rem);
                padding: 1rem;
            }
            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body style="margin: 0">
        <div id="default_screen" class="lobby_screen">
            <div class="topleft_container">
                <button class="button" style="margin: 3px;" onclick="location.href='/maps.html'">
                    Map editor
                    <span class="slot_sprite" style="display: inline-block; background-position: -10px -180px; margin-right: 6px;"></span>
                </button>
                <button class="button" style="margin: 3px;">
                    Discord
                    <span class="slot_sprite" style="display: inline-block; background-position: -20px -180px; margin-right: 6px;"></span>
                </button>
            </div>

            <div class="topright_container">
                <button id="login_button" class="button" onclick="switch_screen('login')">Login</button>
                <button id="logout_button" class="button hidden" onclick="switch_screen('logout')">Logout</button>
            </div>

            <div class="center_container">
                <div id="character_preview">
                    <canvas id="lobby_preview" width="256" height="256" aria-label="Character preview"></canvas>
                </div>
                <form class="panel" autocomplete="off" onsubmit="play(event)">
                    <p class="hidden" role="alert" style="color: var(--ping-bad); margin: 0 0 6px 0;"></p>
                    <input class="text_input" name="username" placeholder="username" autocomplete="off" required>
                    <div style="margin-top: 8px" class="lobby_actions">
                        <select class="dropdown" name="servers" id="servers">
                          <option value="">Loading servers…</option>
                        </select>
                        <button type="submit" class="button_alt">Play</button>
                    </div>
                </form>
                <button style="margin-bottom: 6px" class="button" onclick="switch_screen('leaderboard')">Leaderboard</button>
                <button class="button" onclick="switch_screen('graveyard')">Graveyard</button>
            </div>
        </div>

        <div id="logout_screen" class="lobby_screen hidden">
            <div class="center_container">
                <form class="panel" onsubmit="submit_account(event, 'logout')">
                    <h3 style="margin-right: auto; margin-top: 4px; margin-left: 4px;">Logout</h3>
                    Are you sure you want to logout?
                    <div style="margin-top: 16px" class="lobby_actions">
                        <button type="button" class="button_alt" onclick="switch_screen('default')">Cancel</button>
                        <button type="submit" class="button_alt">Logout</button>
                    </div>
                    <p class="hidden" role="alert" style="color: var(--ping-bad); margin: 4px 0 0;"></p>
                </form>
            </div>
        </div>

        <div id="login_screen" class="lobby_screen hidden">
            <div class="center_container">
                <div class="enemy_preview_slot">
                    <canvas id="enemy_preview" width="256" height="256" aria-label="Enemy preview"></canvas>
                </div>
                <form class="panel" autocomplete="off" onsubmit="submit_account(event, 'login')">
                    <h3 style="margin-right: auto; margin-top: 4px; margin-left: 4px; margin-bottom: 6px;">Login</h3>
                    <p class="hidden" role="alert" style="color: var(--ping-bad); margin: 0 0 12px 0;"></p>
                    <input style="margin-top: 8px;" type="email" name="email" placeholder="email" autocomplete="off" required>
                    <input type="password" name="password" style="margin-top: 4px;" placeholder="password" autocomplete="new-password" required>
                    <div style="margin-top: 8px" class="lobby_actions">
                        <button type="button" class="button_alt" onclick="switch_screen('default')">Cancel</button>
                        <button type="submit" class="button_alt">Confirm</button>
                    </div>
                </form>
                <button style="margin-top: 4px" class="button" onclick="switch_screen('register')">Dont have an account?</button>
            </div>
        </div>

        <div id="register_screen" class="lobby_screen hidden">
            <div class="center_container">
                <div class="enemy_preview_slot"></div>
                <form class="panel" autocomplete="off" onsubmit="submit_account(event, 'register')" oninput="this.elements.password_confirmation.setCustomValidity('')">
                    <h3 style="margin-right: auto; margin-top: 4px; margin-left: 4px; margin-bottom: 6px;">Register</h3>
                    <p class="hidden" role="alert" style="color: var(--ping-bad); margin: 0 0 12px 0;"></p>
                    <input style="margin-top: 8px;" type="email" name="email" placeholder="email" autocomplete="off" required>
                    <input type="password" name="password" style="margin-top: 4px;" placeholder="password" autocomplete="new-password" required>
                    <input type="password" name="password_confirmation" style="margin-top: 4px;" placeholder="confirm password" autocomplete="new-password" required>
                    <div style="margin-top: 8px" class="lobby_actions">
                        <button type="button" class="button_alt" onclick="switch_screen('default')">Cancel</button>
                        <button type="submit" class="button_alt">Confirm</button>
                    </div>
                </form>
                <button style="margin-top: 4px" class="button" onclick="switch_screen('login')">Have an account?</button>
            </div>
        </div>

        <div id="leaderboard_screen" class="lobby_screen hidden">
            <div class="center_container">
                <div class="panel">
                    <h3>Leaderboard</h3>
                    <p>Top 100 characters (dead or alive)</p>
                    <div class="leaderboard_scroll" tabindex="0" aria-label="Leaderboard">
                        <table>
                            <thead><tr><th scope="col">Rank</th><th scope="col">Username</th><th scope="col">Character</th><th scope="col">Level</th></tr></thead>
                            <tbody id="leaderboard_rows">

                            </tbody>
                        </table>
                    </div>
                </div>
                <button id="leaderboard_retry" class="button hidden" onclick="load_leaderboard()">Retry</button>
                <button class="button" onclick="switch_screen('default')">Back</button>
            </div>
        </div>

        <div id="graveyard_screen" class="lobby_screen hidden"></div>

        <script src="/scripts/pkgs/pixi.js"></script>
        <script src="/scripts/pkgs/filters.js"></script>

        <script src="/scripts/data.js"></script>
        <script src="/scripts/engine/networking.js"></script>

        <script src="/scripts/graphics/app.js"></script>
        <script src="/scripts/graphics/load_textures.js"></script>
        <script src="/scripts/graphics/tiles.js"></script>
        <script src="/scripts/graphics/objects.js"></script>

        <script src="/scripts/engine/gameplay/characters.js"></script>

        <script src="/scripts/engine/engine.js"></script>

        <script src="/scripts/lobby/engine.js"></script>
        <script src="/scripts/lobby/characters.js"></script>
        <script src="/scripts/lobby/enemy_preview.js"></script>
        <script src="/scripts/lobby/leaderboard.js"></script>
        <script src="/scripts/lobby/servers.js"></script>
        <script src="/scripts/lobby/default_name.js"></script>
        <script src="/scripts/lobby/play.js"></script>
        <script src="/scripts/lobby/screens.js"></script>
        <script src="/scripts/lobby/auth_panels.js"></script>
        <script>
            const lobby_ready = account_ready.then(() => {
                load_servers();
                return init_lobby();
            });
        </script>
    </body>
</html>
