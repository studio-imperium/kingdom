<html>
    <head>
        <meta charset="utf-8">
        <title>kingdomcrushers.io</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">

        <link rel="stylesheet" href="https://use.typekit.net/jbe5uxg.css" />
        <link rel="stylesheet" href="styles/lobby.css">
        <link rel="stylesheet" href="styles/inventory.css">
    </head>
    <body style="margin: 0">
        <div id="home" class="screen">
            <div id="utilities" class="top_left">
                <button id="map_button" class="img_button" onclick="location.href='/maps.html'">
                    Map editor
                    <span style="background-position: -20px -360px;"></span>
                </button>
                <button class="img_button" onclick="window.open('https://discord.gg/pufAc8wWzd')">
                    Discord
                    <span style="background-position: -60px -360px;"></span>
                </button>
                <button class="img_button" onclick="window.open('https://play.google.com/store/apps/details?id=com.williamqm.mmorelam&hl=en-US')">
                    Play store
                    <span style="background-position: -80px -360px;"></span>
                </button>
            </div>

            <div class="top_right">
                <button id="login_button" class="button" onclick="switch_screen('login')">Login</button>
                <button id="logout_button" class="button hidden" onclick="switch_screen('logout')">Logout</button>
            </div>

            <div id="lobby_main" class="center">
                <div class="preview_slot">
                    <canvas width="256" height="256" id="character_preview"></canvas>
                </div>
                <form class="panel" autocomplete="off" onsubmit="play(event)">
                    <input class="strong_input" name="username" placeholder="username" autocomplete="off" required>
                    <div class="group">
                        <select id="servers" name="servers" disabled>
                          <option value="">Loading...</option>
                        </select>
                        <button type="submit">Play</button>
                    </div>
                    <p class="hidden error" role="alert"></p>
                </form>
                <button id="leaderboard_button" class="button" onclick="switch_screen('leaderboard')">Leaderboard</button>
                <button id="graveyard_button" class="button hidden" onclick="switch_screen('graveyard')">Graveyard</button>
            </div>
        </div>

        <div id="logout" class="screen hidden">
            <div class="center">
                <form class="panel" onsubmit="submit_account(event, 'logout')">
                    <h3>Logout</h3>
                    <p class="hidden error" role="alert"></p>
                    Are you sure you want to logout?
                    <div class="group">
                        <button type="button" onclick="switch_screen('home')">Cancel</button>
                        <button type="submit" >Logout</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="login" class="screen hidden">
            <div class="center">
                <div id="login_preview" class="preview_slot">
                </div>
                <form class="panel" autocomplete="off" onsubmit="submit_account(event, 'login')">
                    <h3>Login</h3>

                    <p class="hidden error" role="alert"></p>
                    <input name="email" type="email" placeholder="email" required>
                    <input name="password" type="password" placeholder="password" required>

                    <div class="group">
                        <button type="button" onclick="switch_screen('home')">Cancel</button>
                        <button type="submit">Confirm</button>
                    </div>
                </form>
                <button class="button" onclick="switch_screen('register')">Dont have an account?</button>
            </div>
        </div>

        <div id="register" class="screen hidden">
            <div class="center">
                <div id="register_preview" class="preview_slot">
                </div>
                <form class="panel" autocomplete="off" onsubmit="submit_account(event, 'register')" oninput="this.elements.password_confirmation.setCustomValidity('')">
                    <h3>Register</h3>

                    <p class="hidden error" role="alert"></p>
                    <input name="email" type="email" placeholder="email" required>
                    <input name="password" type="password" placeholder="password" required>
                    <input name="password_confirmation" type="password" placeholder="confirm password" required>

                    <div class="group">
                        <button type="button" onclick="switch_screen('home')">Cancel</button>
                        <button type="submit">Confirm</button>
                    </div>
                </form>
                <button class="button" onclick="switch_screen('login')">Have an account?</button>
            </div>
        </div>

        <div id="leaderboard" class="screen hidden">
            <div class="center">
                <div class="panel">
                    <h3>Legends</h3>
                    <div class="playerlist" id="leaderboard_list" tabindex="0">
                    </div>
                </div>
                <button class="button" onclick="switch_screen('home')">Back</button>
            </div>
        </div>

        <div id="graveyard" class="screen hidden">
            <div class="center">
                <div class="panel">
                    <h3>Graveyard</h3>
                    <div class="playerlist" id="graveyard_list" tabindex="0">
                    </div>
                </div>
                <button class="button" onclick="switch_screen('home')">Back</button>
            </div>
        </div>

        <script src="/scripts/lobby/account.js"></script>

        <script src="/scripts/pkgs/pixi.js"></script>
        <script src="/scripts/pkgs/filters.js"></script>

        <script src="/scripts/data.js"></script>
        <script src="/scripts/engine/networking.js"></script>

        <script src="/scripts/lobby/lobby.js"></script>

        <script src="/scripts/graphics/load_textures.js"></script>
        <script src="/scripts/graphics/tiles.js"></script>
        <script src="/scripts/graphics/objects.js"></script>

        <script src="/scripts/engine/gameplay/characters.js"></script>
        <script src="/scripts/engine/gameplay/npcs.js"></script>
        <script src="/scripts/engine/engine.js"></script>

        <script src="/scripts/lobby/previews.js"></script>
        <script src="/scripts/graphics/character_preview.js"></script>
        <script src="/scripts/lobby/networking.js"></script>
        <script src="/scripts/lobby/screens.js"></script>
        <script src="/scripts/lobby/play.js"></script>
        <script src="/scripts/mobile/mobile.js"></script>

        <script>
            configure_mobile()
            const lobby_ready = init_lobby()
            const account_ready = restore_session()
            const name_input = document.querySelector('#home [name="username"]')
            name_input.value = localStorage.getItem("kingdom.player_name") || sessionStorage.getItem("kingdom.player_name") || ""
            name_input.addEventListener("input", () => {
              name_input.setCustomValidity("")
              localStorage.setItem("kingdom.player_name", name_input.value)
            })

            Promise.all([account_ready, lobby_ready]).then(() => {
              update_account_buttons()
              populate_graveyard()
              switch_screen(document.querySelector(".screen:not(.hidden)").id)
            }).catch(failure => {
              const error = document.querySelector('#home [role="alert"]')
              error.textContent = failure.message
              error.classList.remove("hidden")
            })
            init_servers().catch(error => {
              select.replaceChildren(new Option("Servers unavailable", ""))
              console.error(error)
            })
            lobby_ready.then(fetch_leaderboards).catch(console.error)
        </script>
    </body>
</html>
